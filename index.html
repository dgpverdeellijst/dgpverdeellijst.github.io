<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>DGP Verdeellijst</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F0EDE8; --line:#E2DCD3;
  --ink:#1B1D22; --ink-2:#5D6472; --ink-3:#8A909C;
  --accent:#EC5A13; --accent-ink:#fff;
  --open:#94A3B8; --deels:#F59E0B; --klaar:#22C55E;
  --rood:#EF4444; --oranje:#F59E0B; --groen:#22C55E;
  --shadow:0 6px 24px rgba(24,20,14,.12); --radius:14px;
  --safe:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121317; --surface:#1B1D22; --surface-2:#23262D; --line:#2E323B;
    --ink:#F1EFEC; --ink-2:#A9B0BC; --ink-3:#727986; --shadow:0 6px 24px rgba(0,0,0,.5); }
}
:root[data-theme="light"]{ --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F0EDE8; --line:#E2DCD3;
  --ink:#1B1D22; --ink-2:#5D6472; --ink-3:#8A909C; --shadow:0 6px 24px rgba(24,20,14,.12); }
:root[data-theme="dark"]{ --bg:#121317; --surface:#1B1D22; --surface-2:#23262D; --line:#2E323B;
  --ink:#F1EFEC; --ink-2:#A9B0BC; --ink-3:#727986; --shadow:0 6px 24px rgba(0,0,0,.5); }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;
  min-height:100dvh;-webkit-overflow-scrolling:touch;}
#app{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(78px + var(--safe));}
button{font-family:inherit;cursor:pointer;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* topbar */
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px 14px;display:flex;align-items:center;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.brand .t{font-size:16px;font-weight:800;letter-spacing:-.01em}
.stripe{width:5px;height:34px;border-radius:3px;background:var(--accent);flex:none}
.hprog{margin-left:auto;display:flex;align-items:center;gap:10px}
.ring{--p:0;width:40px;height:40px;border-radius:50%;flex:none;
  background:conic-gradient(var(--klaar) calc(var(--p)*1%), var(--surface-2) 0);
  display:grid;place-items:center}
.ring i{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-size:11px;font-weight:800;font-style:normal}
.hprog .lab{text-align:right;font-size:11px;color:var(--ink-2);line-height:1.2}
.hprog .lab b{color:var(--ink);font-size:13px}

/* search */
.searchwrap{padding:10px 14px 4px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px}
.search input{border:0;background:transparent;outline:none;color:var(--ink);font-size:15px;width:100%}
.search svg{flex:none;color:var(--ink-3)}
.clearx{border:0;background:var(--surface-2);border-radius:8px;width:26px;height:26px;color:var(--ink-2);
  font-size:15px;display:none;align-items:center;justify-content:center}

main{flex:1;padding:6px 14px 20px}
.hint{color:var(--ink-3);font-size:12.5px;padding:4px 2px 10px}

/* cards / list */
.grid{display:flex;flex-direction:column;gap:9px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 13px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.card:active{transform:scale(.996)}
.loc{font-weight:800;font-size:17px;letter-spacing:-.01em;min-width:64px}
.meta{color:var(--ink-2);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;margin-top:1px}
.meta b{color:var(--ink);font-weight:700}
.grow{flex:1;min-width:0}
.pill{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.open{background:color-mix(in srgb,var(--open) 20%,transparent);color:var(--open)}
.pill.deels{background:color-mix(in srgb,var(--deels) 22%,transparent);color:var(--deels)}
.pill.klaar{background:color-mix(in srgb,var(--klaar) 22%,transparent);color:var(--klaar)}
.mini{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.mini i{display:block;height:100%;background:var(--klaar);border-radius:3px;transition:width .25s}
.cnt{font-size:12px;color:var(--ink-2);font-weight:700;white-space:nowrap}

/* map */
#mapview{position:relative}
.maptools{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.zoombtn{margin-left:auto;display:flex;gap:6px}
.zoombtn button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);
  font-size:18px;font-weight:700;display:grid;place-items:center}
.mapscroll{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  max-height:76vh;position:relative;touch-action:none}
.mapinner{position:relative;width:100%;transform-origin:0 0;will-change:transform}
.mapinner img{width:100%;display:block;pointer-events:none}
.pin{position:absolute;transform:translate(-50%,-50%);transform-origin:center;z-index:2}
.pin button{border:2px solid #fff;border-radius:8px;padding:2px 5px;font-size:10px;font-weight:800;
  color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);line-height:1.1;white-space:nowrap;
  transform:scale(var(--ps,1));transform-origin:center}
.pin.open button,.pin.rood button{background:var(--rood)}
.pin.deels button,.pin.oranje button{background:var(--oranje)}
.pin.klaar button,.pin.groen button{background:var(--groen)}
.pin.food button{border-radius:999px;border-style:dashed;padding:3px 7px}
.pin.manual button{border-style:dashed;border-color:#fde68a}

/* status stoplicht */
.statusbtns{display:flex;gap:8px;margin:2px 0 4px}
.stbtn{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 6px;
  font-weight:800;font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.stbtn .d{width:12px;height:12px;border-radius:50%}
.stbtn.rood .d{background:var(--rood)} .stbtn.oranje .d{background:var(--oranje)} .stbtn.groen .d{background:var(--groen)}
.stbtn.on.rood{border-color:var(--rood);background:color-mix(in srgb,var(--rood) 14%,var(--surface));color:var(--ink)}
.stbtn.on.oranje{border-color:var(--oranje);background:color-mix(in srgb,var(--oranje) 16%,var(--surface));color:var(--ink)}
.stbtn.on.groen{border-color:var(--groen);background:color-mix(in srgb,var(--groen) 14%,var(--surface));color:var(--ink)}
.carddot{width:12px;height:12px;border-radius:50%;flex:none}
.carddot.rood{background:var(--rood)} .carddot.oranje{background:var(--oranje)} .carddot.groen{background:var(--groen)}
.ornote{font-size:12.5px;color:var(--oranje);font-weight:700;margin-top:5px;display:flex;gap:5px;align-items:flex-start}
.orflag{border-left:3px solid var(--oranje)}

/* materiaal */
.matrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;width:100%;text-align:left}
.matname{font-weight:700;font-size:14.5px}
.matcat{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}
.matqty{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-2);white-space:nowrap}
.matqty b{color:var(--ink);font-size:15px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:0;border-radius:10px;
  padding:8px 12px;font-weight:700;font-size:13px;margin-bottom:10px}

/* voortgang */
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat .box{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .box .n{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .box .l{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.secth{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  margin:18px 2px 8px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.prow .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px}
.prow .top b{font-weight:700}
.prow .top span{color:var(--ink-2);font-weight:700}

/* tabbar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe)}
nav button{flex:1;border:0;background:transparent;padding:9px 1px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--ink-3);font-size:9.5px;font-weight:700;letter-spacing:-.01em}
nav button.on{color:var(--accent)}
nav button svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,4,.5);z-index:40;opacity:0;pointer-events:none;
  transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;
  max-width:760px;margin:0 auto;max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .25s ease;box-shadow:var(--shadow)}
.sheet.show{transform:translateY(0)}
#sheetc{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:hidden;border-radius:20px 20px 0 0}
.sheet .sh{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);
  border-radius:20px 20px 0 0}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh .row1{display:flex;align-items:center;gap:12px}
.sh .row1 .loc{font-size:24px}
.sh .close{margin-left:auto;background:var(--surface-2);border:0;border-radius:10px;width:34px;height:34px;
  font-size:18px;color:var(--ink-2)}
.sbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px calc(24px + var(--safe));-webkit-overflow-scrolling:touch}
.listgrp{margin-bottom:16px}
.listgrp h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);
  font-weight:800;margin:0 0 7px}
.titem{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;margin-bottom:7px;width:100%;text-align:left}
.titem.done{background:color-mix(in srgb,var(--klaar) 10%,var(--surface))}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--ink-3);flex:none;display:grid;
  place-items:center;color:#fff}
.titem.done .check{background:var(--klaar);border-color:var(--klaar)}
.check.n{background:var(--oranje);border-color:var(--oranje);color:#fff;font-weight:900}
.titem.nc{background:color-mix(in srgb,var(--oranje) 11%,var(--surface));border-color:color-mix(in srgb,var(--oranje) 35%,var(--line))}
.titem.nc .tn{text-decoration:none;color:var(--ink)}
.matopts{display:flex;gap:8px;margin:-3px 0 8px}
.matopts .stbtn{padding:9px 6px;font-size:12.5px}
.matnotesmall{font-size:11.5px;font-weight:600;color:var(--oranje);margin-top:2px;white-space:normal}
textarea.matnote{margin:-3px 0 9px;min-height:44px;border-color:color-mix(in srgb,var(--oranje) 40%,var(--line))}
.titem{cursor:pointer}
.titem .tn{font-weight:600;font-size:14.5px}
.titem.done .tn{text-decoration:line-through;color:var(--ink-2)}
.qbadge{margin-left:auto;font-weight:800;font-size:15px;background:var(--surface-2);border-radius:8px;
  padding:3px 10px;min-width:34px;text-align:center}
.infochips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.ichip{font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;color:var(--ink-2)}
.ichip b{color:var(--ink)}
.rowbtns{display:flex;gap:8px;margin:2px 0 6px}
.rowbtns button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px;
  font-weight:700;font-size:13px;color:var(--ink-2)}
.rowbtns button.prim{background:var(--accent);color:#fff;border-color:var(--accent)}

/* foto */
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pcard{position:relative;width:92px}
.pcard img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.pcard .note{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.25}
.pcard .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:7px;
  width:24px;height:24px;font-size:14px}
.addphoto{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line);background:var(--surface);
  border-radius:11px;padding:11px 14px;font-weight:700;font-size:13.5px;color:var(--ink-2)}
label.addphoto{cursor:pointer}
.noteinput{width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:9px 11px;color:var(--ink);font-size:14px;font-family:inherit}
.empty{color:var(--ink-3);text-align:center;padding:40px 10px;font-size:14px}
.addbox{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px;margin-bottom:6px}
.addbox .noteinput{margin-top:0}
textarea.noteinput{resize:vertical;min-height:52px;line-height:1.4}
.bigbtn{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:12px;font-weight:800;font-size:15px}
.legendbar{font-size:11px;color:var(--ink-3);padding:2px 2px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- A4 print ---- */
#printroot{display:none}
@media print{
  @page{size:A4 portrait;margin:11mm}
  #app,.scrim,.sheet{display:none!important}
  body{background:#fff!important;color:#000!important;font-size:11px}
  #printroot{display:block;color:#000;font-family:system-ui,Arial,sans-serif}
  .p-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;
    padding-bottom:5px;margin-bottom:9px}
  .p-title{font-size:17px;font-weight:800;letter-spacing:-.01em}
  .p-sub{font-size:10px;color:#333;margin-top:2px}
  .p-meta{font-size:10px;color:#333;text-align:right;line-height:1.35}
  .p-cols{column-count:2;column-gap:9mm}
  .p-bar{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:8px;padding-bottom:5px;
    border-bottom:1px solid #bbb}
  .p-bar h3{font-size:12.5px;margin:0 0 3px;font-weight:800}
  .p-bar h3 .mtr{font-weight:500;color:#333;font-size:10px}
  .p-it{display:flex;align-items:center;gap:6px;font-size:10.5px;line-height:1.6}
  .p-it .q{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .cb{width:10px;height:10px;border:1.3px solid #000;border-radius:2px;display:inline-block;flex:none;
    position:relative}
  .cb.on::after{content:"";position:absolute;inset:1px;background:#000;border-radius:1px}
  .p-tbl{width:100%;border-collapse:collapse}
  .p-tbl th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#555;
    border-bottom:1.5px solid #000;padding:3px 4px}
  .p-tbl td{border-bottom:1px solid #ddd;padding:4px;font-size:11px;font-variant-numeric:tabular-nums}
  .p-note{font-size:9px;color:#555;margin-top:10px;border-top:1px solid #ccc;padding-top:5px}
}
</style>

<div id="app">
  <header>
    <div class="stripe"></div>
    <div class="brand">
      <span class="k">Dutch Grand Prix · Zandvoort<span id="syncbadge"></span></span>
      <span class="t">DGP Verdeellijst</span>
    </div>
    <div class="hprog">
      <div class="lab"><b id="hpDone">0</b>/<span id="hpTot">0</span><br>afgevinkt</div>
      <div class="ring" id="hpRing"><i id="hpPct">0%</i></div>
    </div>
  </header>

  <div class="searchwrap" id="searchwrap">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" placeholder="Zoek bar (B1A1) of materiaal (dixi)…" autocomplete="off">
      <button class="clearx" id="clearx">✕</button>
    </div>
  </div>

  <main id="main"></main>

  <nav>
    <button data-view="kaart" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>Kaart</button>
    <button data-view="bars"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>Bars</button>
    <button data-view="materiaal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Materiaal</button>
    <button data-view="bijzonder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/><path d="M12 7v5M9.5 9.5h5"/></svg>Bijzonder</button>
    <button data-view="voortgang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Voortgang</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div id="sheetc"></div></div>

function ncList(loc){const b=BARS.find(x=>x.loc===loc); if(!b)return []; return b.items.filter(t=>matStat(loc,t.list,t.material)==='n').map(t=>t.material);}

// --- pan/zoom via GPU-transform: sleep=1 vinger, pinch=2 vingers op knijp-punt, wiel=desktop ---
function mapEls(){return [document.querySelector('.mapscroll'),document.getElementById('mapinner')];}
function mapApply(){const [sc,el]=mapEls(); if(!sc||!el)return;
  const W=sc.clientWidth,H=sc.clientHeight,cw=el.offsetWidth,ch=el.offsetHeight;
  mTx=Math.min(0,Math.max(W-mScale*cw,mTx)); mTy=Math.min(0,Math.max(H-mScale*ch,mTy));
  el.style.transform='translate('+mTx+'px,'+mTy+'px) scale('+mScale+')';
  el.style.setProperty('--ps',(1/mScale).toFixed(3));}
function mapZoomAt(target,clientX,clientY){const [sc]=mapEls(); if(!sc)return;
  const r=sc.getBoundingClientRect(),cx=clientX-r.left,cy=clientY-r.top;
  const s1=Math.min(4,Math.max(1,target)),k=s1/mScale;
  mTx=cx-(cx-mTx)*k; mTy=cy-(cy-mTy)*k; mScale=s1; mapApply();}
function setZoom(d){const [sc]=mapEls(); if(!sc)return; const r=sc.getBoundingClientRect();
  mapZoomAt(mScale+d*0.5, r.left+sc.clientWidth/2, r.top+sc.clientHeight/2);}
function resetZoom(){mScale=1;mTx=0;mTy=0;mapApply();}
function addMapGestures(){const [sc,el]=mapEls(); if(!sc||!el)return; mapApply();
  if(sc._g)return; sc._g=1;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  let mode=0,lx=0,ly=0,d0=0,s0=1;
  sc.addEventListener('touchstart',e=>{if(e.touches.length===1){mode=1;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
    else if(e.touches.length>=2){mode=2;d0=dist(e.touches)||1;s0=mScale;}},{passive:true});
  sc.addEventListener('touchmove',e=>{
    if(mode===1&&e.touches.length===1){e.preventDefault();mTx+=e.touches[0].clientX-lx;mTy+=e.touches[0].clientY-ly;
      lx=e.touches[0].clientX;ly=e.touches[0].clientY;mapApply();}
    else if(mode===2&&e.touches.length>=2){e.preventDefault();const nd=dist(e.touches);
      const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
      mapZoomAt(s0*nd/d0,mx,my);}},{passive:false});
  sc.addEventListener('touchend',e=>{if(e.touches.length===1){mode=1;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
    else if(!e.touches.length){mode=0;}},{passive:true});
  sc.addEventListener('wheel',e=>{e.preventDefault();mapZoomAt(mScale*(e.deltaY<0?1.2:0.83),e.clientX,e.clientY);},{passive:false});}

function renderMatDetail(m){

  const dOf=b=>{const t=b.items.find(x=>x.material===m.name);return !!(t&&isDone(b.loc,t.list,t.material));};
  let tot=0,dn=0,doneBars=0; all.forEach(b=>{const t=b.items.find(x=>x.material===m.name);tot+=+t.qty||0;if(dOf(b)){dn+=+t.qty||0;doneBars++;}});
  const pct=tot?Math.round(dn/tot*100):0; const me=m.name.replace(/'/g,"\\'"); const rem=all.length-doneBars;
  main.innerHTML=`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
     <button class="backbtn" style="margin:0" onclick="history.back()">‹ Alle materialen</button>
     <button class="backbtn" style="margin:0;margin-left:auto" onclick="printMat('${me}')">⬇ A4</button></div>
    <div class="hint" style="font-size:15px;color:var(--ink);padding-bottom:6px"><b>${m.name}</b> · ${NL[m.cat]||m.cat}</div>
    <div class="prow"><div class="top"><b>${rem} bars nog te doen</b><span class="tnum">${dn}/${tot} st · ${pct}%</span></div><div class="mini"><i style="width:${pct}%"></i></div></div>
    <div class="grid">`+all.map(b=>{const t=b.items.find(x=>x.material===m.name); const d=dOf(b);
      return `<button class="titem ${d?'done':''}" onclick="toggleMat('${b.loc.replace(/'/g,"\\'")}','${me}')">
        <span class="check">${d?'✓':''}</span>
        <span class="tn" style="${d?'text-decoration:line-through;color:var(--ink-3)':''}">${b.loc}<span style="color:var(--ink-3);font-weight:500"> · ${b.meters??'?'} m</span></span>
        <span class="qbadge tnum">${t.qty}</span></button>`;}).join('')+`</div>`;
}
function toggleMat(loc,mat){const b=BARS.find(x=>x.loc===loc); const t=b.items.find(x=>x.material===mat);
  toggle(loc,t.list,t.material); render();}

// ---- VOORTGANG ----
function renderProg(){
  const t=totals();
  const idx=matIndex();
  const mats=Object.values(idx).map(m=>{let tot=0,done=0;
    m.bars.forEach(b=>b.items.forEach(x=>{if(x.material===m.name){tot++;if(isDone(b.loc,x.list,x.material))done++;}}));
    return{name:m.name,cat:m.cat,tot,done,pct:tot?Math.round(done/tot*100):0};})
    .sort((a,b)=>a.pct-b.pct||b.tot-a.tot);
  const areas={};BARS.forEach(b=>{const s=barStat(b);const a=b.area||'—';(areas[a]=areas[a]||{tot:0,done:0}).tot+=s.tot;areas[a].done+=s.done;});
  const bt=barTotals();
  const oranje=BARS.filter(b=>barStatus(b.loc)==='oranje').sort((a,b)=>locCmp(a.loc,b.loc));
  main.innerHTML=`
   <div class="stat">
     <div class="box"><div class="n tnum">${t.d}</div><div class="l">Afgevinkt</div></div>
     <div class="box"><div class="n tnum" style="color:var(--oranje)">${t.t-t.d}</div><div class="l">Nog te doen</div></div>
     <div class="box"><div class="n tnum">${t.pct}%</div><div class="l">Compleet</div></div>
   </div>
   <div class="prow"><div class="top"><b>Materialen afgevinkt</b><span class="tnum">${t.d}/${t.t}</span></div><div class="mini"><i style="width:${t.pct}%"></i></div></div>
   <div class="secth">Bar-status (stoplicht)</div>
   <div class="stat">
     <div class="box"><div class="n tnum" style="color:var(--groen)">${bt.g}</div><div class="l">Gedaan</div></div>
     <div class="box"><div class="n tnum" style="color:var(--oranje)">${bt.o}</div><div class="l">Niet compleet</div></div>
     <div class="box"><div class="n tnum" style="color:var(--rood)">${bt.r}</div><div class="l">Nog niet</div></div>
   </div>
   ${oranje.length?`<div class="secth">Aandacht — niet compleet</div>`+oranje.map(b=>{const le=b.loc.replace(/'/g,"\\'");
     return `<button class="card orflag" style="margin-bottom:7px" onclick="openBar('${le}')"><span class="carddot oranje"></span>
       <div class="grow"><b>${b.loc}</b>${statusNote(b.loc)?`<div class="ornote" style="margin-top:2px">⚠ ${escapeHtml(statusNote(b.loc))}</div>`:''}</div></button>`;}).join(''):''}
   <div class="secth">Per materiaal (afgevinkt)</div>
   ${mats.map(m=>prow(NL[m.cat]?m.name:m.name,m.done,m.tot,m.pct,NL[m.cat]||m.cat)).join('')}
   <div class="secth">Per area</div>
   ${Object.entries(areas).sort().map(([a,v])=>prow(a,v.done,v.tot,v.tot?Math.round(v.done/v.tot*100):0)).join('')}
   <div class="secth">Printen \u00b7 A4</div>
   <div class="rowbtns"><button class="prim" onclick="printFull()">\u2b07 A4 downloaden \u2014 volledig overzicht</button></div>
   <div class="legendbar">Download een A4-bestand met alle bars, materialen &amp; vinkvakjes; open het en druk Ctrl/Cmd+P om te printen of als PDF op te slaan. Per verdeellijst? Ga naar \u2018Materiaal\u2019 \u2192 kies er \u00e9\u00e9n \u2192 knop \u2018\u2b07 A4\u2019.</div>
   <div class="secth">Beheer</div>
   <div class="rowbtns"><button onclick="resetAll()">Alles wissen (afvinken)</button></div>
   <div class="legendbar">Afvinken & foto\u2019s staan lokaal op dit apparaat opgeslagen.</div>`;
}
function prow(name,done,tot,pct,sub){return `<div class="prow"><div class="top">
  <b>${name}${sub?' <span style="color:var(--ink-3);font-weight:600;font-size:11px;text-transform:uppercase">'+sub+'</span>':''}</b>
  <span class="tnum">${done}/${tot}</span></div>
  <div class="mini"><i style="width:${pct}%;background:${pct===100?'var(--klaar)':'var(--deels)'}"></i></div></div>`;}
function resetAll(){if(confirm('Alle status (gedaan/niet compleet) wissen? Foto\u2019s blijven staan.')){S.mat={};save();render();}}

// ---- BIJZONDERE LOCATIES ----
let spPending=null, spDraft={where:'',note:''};
function renderSpecial(){const items=S.special||[];
  main.innerHTML=`
   <div class="hint">Bijzondere locaties die buiten de standaard bars vallen. Iedereen kan hier een foto, plek en notitie toevoegen.</div>
   <div class="addbox">
     <label class="addphoto" style="width:100%;justify-content:center">\ud83d\udcf7 ${spPending?'Andere foto kiezen':'Foto maken / kiezen'}
       <input type="file" accept="image/*" style="display:none" onchange="spPhoto(event)"></label>
     ${spPending?`<img src="${spPending}" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)">`:''}
     <input class="noteinput" id="spwhere" value="${escapeHtml(spDraft.where)}" oninput="spDraft.where=this.value" placeholder="Waar is het? (bijv. B13A of \u2018hoek tribune 3\u2019)">
     <textarea class="noteinput" id="spnote" rows="2" oninput="spDraft.note=this.value" placeholder="Wat is er? / wat moet hier gebeuren">${escapeHtml(spDraft.note)}</textarea>
     <button class="bigbtn" onclick="spAdd()">+ Toevoegen aan lijst</button>
   </div>
   <div class="secth">Toegevoegd (${items.length})</div>
   ${items.length?'<div class="grid">'+items.map((p,i)=>`
     <div class="card" style="align-items:flex-start">
       ${p.img?`<img src="${p.img}" style="width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line);flex:none">`:''}
       <div class="grow"><div style="font-weight:800">${p.where?escapeHtml(p.where):'\u2014'}</div>
         <div style="color:var(--ink-2);font-size:13px;margin-top:3px;white-space:pre-wrap">${p.note?escapeHtml(p.note):''}</div></div>
       <button class="close" style="margin:0" onclick="delSpecial(${i})">\u2715</button>
     </div>`).join('')+'</div>':'<div class="empty">Nog niks toegevoegd.</div>'}`;
}
function spPhoto(ev){const f=ev.target.files[0];if(!f)return;compressFile(f,d=>{if(!d){alert('Kon foto niet verwerken.');return;}spPending=d;render();});}
function spAdd(){const where=(spDraft.where||'').trim(), note=(spDraft.note||'').trim();
  if(!spPending&&!where&&!note){alert('Voeg minstens een foto, plek of notitie toe.');return;}
  (S.special=S.special||[]).unshift({img:spPending,where:where,note:note,ts:Date.now()});
  spPending=null;spDraft={where:'',note:''};save();render();}
function delSpecial(i){if(!confirm('Deze locatie verwijderen?'))return;S.special.splice(i,1);save();render();}

// ---- BAR SHEET ----
let curBar=null;
const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet'),sheetc=document.getElementById('sheetc');
let _ov=[]; // overlay-stack zodat de telefoon-terugknop elk scherm sluit
function _pushOv(kind){_ov.push(kind);try{history.pushState({ov:_ov.length},'');}catch(e){}}
window.addEventListener('popstate',function(){const k=_ov.pop();
  if(k==='bar')_closeBarNow(); else if(k==='mat'){selMat=null;render();}});
scrim.onclick=closeBar;
function closeBar(){ if(curBar) history.back(); }
function _closeBarNow(){sheet.classList.remove('show');scrim.classList.remove('show');curBar=null;}
function openBar(loc){curBar=BARS.find(b=>b.loc===loc);expMat=null;paintSheet();sheet.classList.add('show');scrim.classList.add('show');_pushOv('bar');}
function paintSheet(){const b=curBar;if(!b)return;const s=barStat(b);
  const st=barStatus(b.loc);const note=statusNote(b.loc);const le=b.loc.replace(/'/g,"\\'");
  const byList={};b.items.forEach(t=>{(byList[t.list]=byList[t.list]||[]).push(t);});
  const photos=S.photos[b.loc]||[];
  sheetc.innerHTML=`<div class="sh"><div class="grab"></div>
     <div class="row1"><span class="carddot ${st}" style="width:16px;height:16px"></span><div class="loc tnum">${b.loc}</div>
       <div class="grow"><div class="meta"><span><b>${b.meters??'?'}</b> meter</span><span>${b.area||''}</span></div></div>
       <button class="close" onclick="closeBar()">✕</button></div>
   </div>
   <div class="sbody">
     <div class="secth" style="margin:2px 2px 8px">Materialen — tik voor <b style="color:var(--groen)">Gedaan</b> of <b style="color:var(--oranje)">Niet compleet</b> · <span class="tnum" style="color:var(--ink-2)">${s.done}/${s.tot}</span></div>
     <div class="mini" style="margin:0 0 8px"><i style="width:${s.pct}%"></i></div>
     <div class="rowbtns">
       <button class="prim" onclick="markBar(1)">Alles afvinken</button>
       <button onclick="markBar(0)">Alles wissen</button>
     </div>
     ${Object.entries(byList).map(([l,ts])=>`<div class="listgrp"><h4>${NL[l]||l}</h4>`+
        ts.map(t=>{const st=matStat(b.loc,t.list,t.material);const k=tkey(b.loc,t.list,t.material);const exp=expMat===k;const mn=matNote(b.loc,t.list,t.material);
          const le=t.list.replace(/'/g,"\\'"),me=t.material.replace(/'/g,"\\'");
          return `<div class="titem ${st==='g'?'done':''} ${st==='n'?'nc':''}" onclick="expandMat('${le}','${me}')">
            <span class="check ${st}">${st==='g'?'✓':st==='n'?'!':''}</span>
            <div class="tn" style="flex:1;min-width:0">${t.material}${st==='n'&&mn?`<div class="matnotesmall">⚠ ${escapeHtml(mn)}</div>`:''}</div>
            <span class="qbadge tnum">${t.qty}</span></div>`+
            (exp?`<div class="matopts">
              <button class="stbtn groen ${st==='g'?'on':''}" onclick="chooseMat('${le}','${me}','g')"><span class="d"></span>Gedaan</button>
              <button class="stbtn oranje ${st==='n'?'on':''}" onclick="chooseMat('${le}','${me}','n')"><span class="d"></span>Niet compleet</button>
            </div>`+(st==='n'?`<textarea class="noteinput matnote" placeholder="Wat is er niet compleet? (bijv. ‘1 stuk mist’)" oninput="noteMat('${le}','${me}',this.value)">${escapeHtml(mn)}</textarea>`:''):'');}).join('')+`</div>`).join('')}
     ${b.info.length?`<div class="listgrp"><h4>Info</h4><div class="infochips">`+
        b.info.map(t=>`<span class="ichip">${t.material}: <b>${t.qty}</b></span>`).join('')+`</div></div>`:''}
     <div class="listgrp"><h4>Bijzondere locatie · foto\u2019s</h4>
       <label class="addphoto">📷 Foto toevoegen
         <input type="file" accept="image/*" style="display:none" onchange="addPhoto(event)"></label>
       <input class="noteinput" id="pnote" placeholder="Notitie bij volgende foto (bijv. ‘achter tribune, moeilijk bereikbaar’)">
       <div class="photos">${photos.map((p,i)=>`<div class="pcard"><button class="del" onclick="delPhoto(${i})">✕</button>
         <img src="${p.img}" alt=""><div class="note">${p.note?escapeHtml(p.note):''}</div></div>`).join('')}</div>
     </div>
   </div>`;
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let expMat=null;
function tapTask(l,m){toggle(curBar.loc,l,m);paintSheet();paintHeader();}
function expandMat(l,m){const k=tkey(curBar.loc,l,m);expMat=(expMat===k)?null:k;paintSheet();}
function noteMat(l,m,v){setMatNote(curBar.loc,l,m,v);}
function chooseMat(l,m,st){const nw=(matStat(curBar.loc,l,m)===st?'':st);setMat(curBar.loc,l,m,nw);
  expMat=(nw==='n')?tkey(curBar.loc,l,m):null;  // niet-compleet: blijf open zodat je een notitie kunt typen
  paintSheet();paintHeader();}
// top-knoppen: hele bar in één keer (Gedaan = alle materialen gedaan, Nog niet = alles wissen)
function pickStatus(loc,st){const b=BARS.find(x=>x.loc===loc);if(!b)return;b.items.forEach(t=>setMat(loc,t.list,t.material, st==='groen'?'g':''));expMat=null;paintSheet();paintHeader();}
function markBar(on){curBar.items.forEach(t=>setMat(curBar.loc,t.list,t.material,on?'g':''));paintSheet();paintHeader();}
function delPhoto(i){const a=S.photos[curBar.loc]||[];a.splice(i,1);if(!a.length)delete S.photos[curBar.loc];save();paintSheet();}
function compressFile(f,cb){let done=false;const once=v=>{if(done)return;done=true;cb(v);};
  const to=setTimeout(()=>once(null),12000);   // vangnet: kapotte/HEIC-foto die niet decodeert
  const img=new Image(),rd=new FileReader();
  rd.onerror=()=>{clearTimeout(to);once(null);};
  rd.onload=()=>{img.onload=()=>{clearTimeout(to);const M=1000;let w=img.width,h=img.height;const sc=Math.min(1,M/Math.max(w,h));
    const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);once(c.toDataURL('image/jpeg',0.6));};
    img.onerror=()=>{clearTimeout(to);once(null);};img.src=rd.result;};rd.readAsDataURL(f);}
function addPhoto(ev){const f=ev.target.files[0];if(!f)return;const note=(document.getElementById('pnote')||{}).value||'';
  compressFile(f,data=>{if(!data){alert('Kon foto niet verwerken.');return;}
    (S.photos[curBar.loc]=S.photos[curBar.loc]||[]).push({img:data,note:note,ts:Date.now()});save();paintSheet();});}

// ---- A4 PRINT ----
function pdate(){try{return new Date().toLocaleDateString('nl-NL',{day:'numeric',month:'long',year:'numeric'});}catch(e){return'';}}
const _slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function saveCanvas(cv,base){cv.toBlob(function(b){if(!b){alert('Kon de afbeelding niet maken.');return;}
  if(window.claude&&window.claude.downloads){window.claude.downloads.save({filename:base+'.png',data:b}).catch(function(e){if(e&&e.code!=='declined')alert('Downloaden lukt niet ('+((e&&e.code)||'onbekend')+').');});}
  else{var a=document.createElement('a');a.download=base+'.png';a.href=cv.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();}},'image/png');}
function drawCb(ctx,x,y,done){ctx.strokeStyle='#000';ctx.lineWidth=1.4;ctx.strokeRect(x,y,13,13);if(done){ctx.fillStyle='#000';ctx.fillRect(x+3,y+3,7,7);}}
function mkCanvas(W,H){var SC=2;while(W*SC*H*SC>15000000&&SC>1)SC-=0.5;if(SC<1)SC=1;
  var cv=document.createElement('canvas');cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);
  var ctx=cv.getContext('2d');ctx.scale(SC,SC);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.textBaseline='middle';ctx.textAlign='left';return [cv,ctx];}
function pHeader(ctx,W,PAD,title,sub,meta){ctx.fillStyle='#000';ctx.font='800 26px system-ui,Arial';ctx.fillText(title,PAD,38);
  ctx.font='500 13px system-ui,Arial';ctx.fillStyle='#555';ctx.fillText(sub,PAD,64);
  ctx.textAlign='right';ctx.fillText(meta,W-PAD,52);ctx.textAlign='left';
  ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PAD,82);ctx.lineTo(W-PAD,82);ctx.stroke();}
function printMat(name){
  var bars=BARS.filter(function(b){return b.items.some(function(t){return t.material===name;});}).sort(function(a,b){return locCmp(a.loc,b.loc);});
  var tot=0,done=0,cat=(BARS.flatMap(function(b){return b.items;}).find(function(t){return t.material===name;})||{}).list;
  bars.forEach(function(b){var t=b.items.find(function(x){return x.material===name;});tot+=+t.qty||0;if(isDone(b.loc,t.list,t.material))done+=+t.qty||0;});
  var W=900,PAD=40,top=104,rowH=38,H=top+bars.length*rowH+46;
  var r=mkCanvas(W,H),cv=r[0],ctx=r[1];
  pHeader(ctx,W,PAD,'Verdeellijst — '+name,(NL[cat]||cat||'')+' · Heineken Dutch Grand Prix',pdate()+'   ·   '+bars.length+' bars · '+done+'/'+tot+' st');
  ctx.font='700 11px system-ui,Arial';ctx.fillStyle='#888';ctx.fillText('BAR',PAD+30,98);ctx.fillText('METERS',330,98);ctx.fillText('AREA',440,98);ctx.textAlign='right';ctx.fillText('AANTAL',W-PAD,98);ctx.textAlign='left';
  var y=top+rowH/2;
  bars.forEach(function(b){var t=b.items.find(function(x){return x.material===name;});var d=isDone(b.loc,t.list,t.material);
    drawCb(ctx,PAD,y-7,d);
    ctx.fillStyle='#000';ctx.font='700 15px system-ui,Arial';ctx.fillText(b.loc,PAD+30,y);
    ctx.font='400 13px system-ui,Arial';ctx.fillStyle='#333';ctx.fillText((b.meters==null?'?':b.meters)+' m',330,y);ctx.fillText(b.area||'',440,y);
    ctx.textAlign='right';ctx.font='700 14px system-ui,Arial';ctx.fillStyle='#000';ctx.fillText('×'+t.qty,W-PAD,y);ctx.textAlign='left';
    ctx.strokeStyle='#e6e6e6';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD,y+rowH/2);ctx.lineTo(W-PAD,y+rowH/2);ctx.stroke();y+=rowH;});
  ctx.fillStyle='#999';ctx.font='400 10px system-ui,Arial';ctx.fillText('Vinkvakjes = status op dit apparaat op '+pdate(),PAD,H-20);
  saveCanvas(cv,'verdeellijst-'+_slug(name));}
function printFull(){
  var t=totals();var list=BARS.filter(function(b){return b.items.length;}).sort(function(a,b){return locCmp(a.loc,b.loc);});
  var COLS=list.length>40?3:2,lineH=17,headH=19,gap=9;
  var blocks=list.map(function(b){return {loc:b.loc,meta:(b.meters==null?'?':b.meters)+' m · '+(b.area||''),items:b.items.map(function(it){return {m:it.material,q:it.qty,d:isDone(b.loc,it.list,it.material)};})};});
  var bh=blocks.map(function(bl){return headH+bl.items.length*lineH+gap;});
  var colH=[],cols=[];for(var i=0;i<COLS;i++){colH.push(0);cols.push([]);}
  blocks.forEach(function(bl,i){var c=0;for(var k=1;k<COLS;k++)if(colH[k]<colH[c])c=k;cols[c].push(bl);colH[c]+=bh[i];});
  var PAD=36,colGap=22,top=98,W=COLS===3?1440:1080;var colW=(W-2*PAD-(COLS-1)*colGap)/COLS;
  var H=top+Math.max.apply(null,colH)+34;
  var r=mkCanvas(W,H),cv=r[0],ctx=r[1];
  pHeader(ctx,W,PAD,'Verdeellijst DGP — Bars','Heineken Dutch Grand Prix · Zandvoort',pdate()+'   ·   '+list.length+' bars · '+t.d+'/'+t.t+' afgevinkt ('+t.pct+'%)');
  cols.forEach(function(col,ci){var x=PAD+ci*(colW+colGap),y=top;
    col.forEach(function(bl){
      ctx.fillStyle='#000';ctx.font='800 13px system-ui,Arial';ctx.fillText(bl.loc,x,y+9);var lw2=ctx.measureText(bl.loc).width;
      ctx.font='500 10px system-ui,Arial';ctx.fillStyle='#555';ctx.fillText('· '+bl.meta,x+lw2+6,y+9);y+=headH;
      bl.items.forEach(function(it){drawCb(ctx,x,y+2,it.d);
        ctx.fillStyle='#000';ctx.font='400 11px system-ui,Arial';var nm=it.m,maxw=colW-52;while(ctx.measureText(nm).width>maxw&&nm.length>4){nm=nm.slice(0,-2);}
        ctx.fillText(nm,x+19,y+9);
        ctx.textAlign='right';ctx.font='700 11px system-ui,Arial';ctx.fillText('×'+it.q,x+colW,y+9);ctx.textAlign='left';y+=lineH;});
      ctx.strokeStyle='#ddd';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+3);ctx.lineTo(x+colW,y+3);ctx.stroke();y+=gap;});});
  saveCanvas(cv,'verdeellijst-volledig');}

// initial view via #hash + optional ?open=BAR (deep-link / QA)
(function(){const h=location.hash.slice(1);const views=['kaart','bars','materiaal','bijzonder','voortgang'];
  if(views.includes(h)){view=h;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.view===h));}
})();
document.getElementById('searchwrap').style.display=NOSEARCH(view)?'none':'';
render();
(function(){const o=new URLSearchParams(location.search).get('open');
  if(o&&BARS.find(b=>b.loc===o))openBar(o);})();
initSync();
</script>
